# The feed relay (ADR 0030): tested, then deployed to Cloudflare when its code changes. Kept apart from the site and
# the letter's Worker, so a problem here never holds either back.
name: relay

on:
  push:
    branches: [main]
    paths: [relay/**, package-lock.json, .github/workflows/relay.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx vitest run relay
      - run: npx tsc -p relay/tsconfig.json
      - run: npx wrangler deploy   # creates andreamnc-feeds on the first run
        working-directory: relay
      - name: Can Cloudflare read the Substack feed?
        run: curl -sf -o /dev/null -w "relay answered %{http_code}\n" https://andreamnc.com/feeds/substack || echo "::warning::Substack turned the relay away; Latest keeps its saved Substack posts until a run from Andre's machine"
