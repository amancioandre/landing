# Latest follows what Andre publishes (ADR 0030): every 30 minutes the collector reads YouTube, Substack and his tagged
# original repos into src/content/latest.json. Only when that file changes is it committed and the site rebuilt.
# A push made with this workflow's own token starts no workflow, so it asks for the site's build by name.
# GitHub pauses scheduled workflows after 60 days without activity in the repo; running this by hand wakes it again.
name: latest

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: latest
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run collect:latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit and rebuild when Latest changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add src/content/latest.json
          if git diff --cached --quiet; then echo "Latest unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(latest): follow what Andre published"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run site.yml --ref main
